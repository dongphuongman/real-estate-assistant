services:
  # Backend: FastAPI + SQLite + ChromaDB in-memory
  # Public repository: AleksNeStu/ai-real-estate-assistant
  - type: web
    name: realestate-api
    plan: free
    dockerFilePath: ./deploy/docker/Dockerfile.backend
    dockerContext: .
    repo: https://github.com/AleksNeStu/ai-real-estate-assistant
    envVars:
      - key: PORT
        value: "10000"
      - key: ENVIRONMENT
        value: production
      - key: DEFAULT_PROVIDER
        value: openai
      - key: DEFAULT_MODEL
        value: gpt-4o-mini
      - key: ZAI_API_KEY
        sync: false
      - key: API_ACCESS_KEY
        sync: false
      - key: CORS_ALLOW_ORIGINS
        value: https://realestate-web.onrender.com,https://ai-real-estate-assistant.vercel.app
      - key: AUTH_JWT_ENABLED
        value: "false"
      - key: INTERNET_ENABLED
        value: "false"
      - key: SEED_ON_STARTUP
        value: "true"
      - key: CACHE_ENABLED
        value: "true"
      - key: METRICS_ENABLED
        value: "false"
      - key: API_RATE_LIMIT_ENABLED
        value: "false"
      - key: VECTOR_PERSIST_ENABLED
        value: "false"

  # Frontend: Next.js standalone
  # Public repository: AleksNeStu/ai-real-estate-assistant
  - type: web
    name: realestate-web
    plan: free
    dockerFilePath: ./deploy/docker/Dockerfile.frontend
    dockerContext: .
    repo: https://github.com/AleksNeStu/ai-real-estate-assistant
    envVars:
      - key: BACKEND_API_URL
        value: https://realestate-api.onrender.com/api/v1
      - key: API_ACCESS_KEY
        sync: false
      - key: NEXT_PUBLIC_API_URL
        value: /api/v1
      - key: NODE_ENV
        value: production
