services:
  # Backend: FastAPI + SQLite + ChromaDB in-memory
  - type: web
    name: realestate-api
    plan: free
    dockerfilePath: ./deploy/docker/Dockerfile.backend
    dockerContext: .
    envVars:
      - key: PORT
        value: "10000"
      - key: ENVIRONMENT
        value: production
      - key: DEFAULT_PROVIDER
        value: zai
      - key: DEFAULT_MODEL
        value: glm-4.7-flash
      - key: ZAI_API_KEY
        sync: false
      - key: API_ACCESS_KEY
        sync: false
      - key: CORS_ALLOW_ORIGINS
        value: https://realestate-web.onrender.com
      - key: AUTH_JWT_ENABLED
        value: "false"
      - key: INTERNET_ENABLED
        value: "false"
      - key: SEED_ON_STARTUP
        value: "true"
      - key: CACHE_ENABLED
        value: "true"
      - key: METRICS_ENABLED
        value: "false"
      - key: API_RATE_LIMIT_ENABLED
        value: "false"
      - key: VECTOR_PERSIST_ENABLED
        value: "false"

  # Frontend: Next.js standalone
  - type: web
    name: realestate-web
    plan: free
    dockerfilePath: ./deploy/docker/Dockerfile.frontend
    dockerContext: .
    envVars:
      - key: BACKEND_API_URL
        value: https://realestate-api.onrender.com/api/v1
      - key: API_ACCESS_KEY
        sync: false
      - key: NODE_ENV
        value: production
