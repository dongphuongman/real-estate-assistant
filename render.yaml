services:
  # Staging backend (dev branch)
  - type: web
    name: realestate-api
    plan: free
    branch: dev
    runtime: docker
    dockerfilePath: deploy/docker/Dockerfile.backend
    dockerContext: .
    repo: https://github.com/AleksNeStu/ai-real-estate-assistant
    envVars:
      - key: PORT
        value: "10000"
      - key: ENVIRONMENT
        value: staging
      - key: DEFAULT_PROVIDER
        value: zai
      - key: DEFAULT_MODEL
        value: glm-4.7-flash
      # LLM Provider Keys
      - key: ZHIPUAI_API_KEY
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: API_ACCESS_KEY
        sync: false
      - key: CORS_ALLOW_ORIGINS
        value: https://realestate-web-dz1y.onrender.com
      - key: AUTH_JWT_ENABLED
        value: "true"
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: INTERNET_ENABLED
        value: "false"
      - key: SEED_ON_STARTUP
        value: "true"
      - key: VECTOR_PERSIST_ENABLED
        value: "false"
      - key: SENTRY_DSN
        sync: false
      - key: DEMO_MODE
        value: "true"
    healthCheckPath: /health

  # Frontend (dev branch — API deploy triggers rebuild for prod via workflow)
  - type: web
    name: realestate-web
    plan: free
    branch: dev
    runtime: docker
    dockerfilePath: deploy/docker/Dockerfile.frontend
    dockerContext: .
    repo: https://github.com/AleksNeStu/ai-real-estate-assistant
    envVars:
      - key: PORT
        value: "10000"
      - key: HOSTNAME
        value: "0.0.0.0"
      - key: BACKEND_API_URL
        value: https://realestate-api-wkm7.onrender.com/api/v1
      - key: API_ACCESS_KEY
        sync: false
      - key: NEXT_PUBLIC_API_URL
        value: /api/v1
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_SENTRY_DSN
        sync: false
      - key: NEXT_PUBLIC_DEMO_MODE
        value: "true"
    healthCheckPath: /
