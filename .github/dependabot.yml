version: 2

updates:
  # Frontend (npm)
  - package-ecosystem: npm
    directory: /apps/web
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - frontend
    commit-message:
      prefix: chore(deps-web)
    reviewers:
      - AleksNeStu
    groups:
      dev-patch-and-minor:
        patterns: ["*"]
        update-types: ["patch", "minor"]
        exclude-patterns:
          - "next"
          - "react"
          - "react-dom"
          - "postcss"

  # Backend (pip)
  - package-ecosystem: pip
    directory: /apps/api
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - backend
    commit-message:
      prefix: chore(deps-api)
    reviewers:
      - AleksNeStu
    groups:
      dev-patch-and-minor:
        patterns: ["*"]
        update-types: ["patch", "minor"]
        exclude-patterns:
          - "langchain"
          - "langchain-core"
          - "langchain-community"
          - "chromadb"

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: chore(ci-deps)
    groups:
      actions-updates:
        patterns: ["*"]
