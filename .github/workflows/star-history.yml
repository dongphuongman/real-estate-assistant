name: Star History

# Regenerates a self-hosted star-history chart as static SVGs on an orphan
# branch, referenced by README.md. Needed because GitHub restricted the
# stargazers API on 2026-06-30, which broke the hosted star-history.com embed
# (api.star-history.com now returns 503 for repos it isn't a collaborator on).
# Uses the repo's own GITHUB_TOKEN (no PAT, no secret in the README).

on:
  schedule:
    - cron: '17 3 * * *' # daily ~03:17 UTC (off-round minute)
  push:
    branches: [dev]
    paths:
      - '.github/workflows/star-history.yml'
  workflow_dispatch: # manual first run creates the orphan branch

permissions:
  contents: write # required to push the star-history orphan branch

concurrency:
  group: star-history
  cancel-in-progress: true

jobs:
  star-history:
    if: github.repository_owner == 'AleksNeStu'
    runs-on: ubuntu-latest
    steps:
      - uses: carsteneu/mystarhistory@v1
        with:
          repos: ${{ github.repository }} # AleksNeStu/ai-real-estate-assistant
