name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: production
        type: choice
        options:
          - production
          - staging

permissions:
  contents: read
  deployments: write

env:
  RENDER_SERVICE_ID_API: ${{ secrets.RENDER_SERVICE_ID_API }}
  RENDER_SERVICE_ID_WEB: ${{ secrets.RENDER_SERVICE_ID_WEB }}
  RENDER_BACKEND_URL: ${{ secrets.RENDER_BACKEND_URL }}

jobs:
  ci-check:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v6

      - name: Verify CI passed on main
        uses: actions/github-script@v9
        with:
          script: |
            const runs = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'ci.yml',
              branch: 'main',
              status: 'completed',
              per_page: 1
            });
            if (!runs.data.workflow_runs.length || runs.data.workflow_runs[0].conclusion !== 'success') {
              core.setFailed('Last CI run on main did not succeed. Deploy blocked.');
            } else {
              core.info('CI passed. Proceeding with deployment.');
            }

  validate:
    needs: [ci-check]
    if: always() && needs.ci-check.result != 'failure'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate deployment configs
        run: |
          echo "Validating deployment configurations..."
          # Check required files exist
          for f in render.yaml vercel.json deploy/docker/Dockerfile.backend deploy/docker/Dockerfile.frontend deploy/compose/docker-compose.yml; do
            if [ ! -f "$f" ]; then
              echo "ERROR: Missing $f"
              exit 1
            fi
            echo "  ✓ $f"
          done

          # Check render.yaml has no placeholder secrets
          if grep -q "REPLACE_WITH" render.yaml; then
            echo "ERROR: render.yaml contains placeholder values"
            exit 1
          fi
          echo "  ✓ render.yaml - no placeholders"

          # Check Dockerfiles build successfully (dry-run)
          docker build --check -f deploy/docker/Dockerfile.backend . 2>/dev/null || \
            docker build -f deploy/docker/Dockerfile.backend --target deps . 1>/dev/null
          echo "  ✓ Backend Dockerfile builds"

  deploy-backend:
    needs: validate
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'production' }}
    steps:
      - name: Select Render service
        id: service
        run: |
          if [ "${{ github.event.inputs.environment }}" = "staging" ]; then
            echo "id=${{ secrets.RENDER_SERVICE_ID_API_STAGING }}" >> $GITHUB_OUTPUT
            echo "url=${{ secrets.RENDER_BACKEND_URL_STAGING }}" >> $GITHUB_OUTPUT
          else
            echo "id=${{ secrets.RENDER_SERVICE_ID_API }}" >> $GITHUB_OUTPUT
            echo "url=${{ secrets.RENDER_BACKEND_URL }}" >> $GITHUB_OUTPUT
          fi

      - name: Get previous deploy ID (for rollback)
        id: prev-deploy
        run: |
          PREV=$(curl -s "https://api.render.com/v1/services/${{ steps.service.outputs.id }}/deploys?limit=1" \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" | jq -r '.[0].id // empty')
          echo "id=$PREV" >> $GITHUB_OUTPUT

      - name: Trigger Render backend deploy
        if: steps.service.outputs.id != ''
        run: |
          curl -s -X POST "https://api.render.com/v1/services/${{ steps.service.outputs.id }}/deploys" \
            -H "Accept: application/json" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            -d '{"clearCache": "clear"}' | jq .

      - name: Wait for backend health
        run: |
          echo "Waiting for backend to become healthy..."
          for i in $(seq 1 30); do
            if curl -sf "${{ steps.service.outputs.url }}/health" | jq -e '.status == "healthy"' >/dev/null 2>&1; then
              echo "Backend is healthy!"
              exit 0
            fi
            echo "  Attempt $i/30 - waiting 30s..."
            sleep 30
          done
          echo "ERROR: Backend health check failed after 15 minutes"
          exit 1

      - name: Rollback on failure
        if: failure() && steps.prev-deploy.outputs.id != ''
        run: |
          echo "Rolling back to previous deploy: ${{ steps.prev-deploy.outputs.id }}"
          curl -s -X POST "https://api.render.com/v1/services/${{ steps.service.outputs.id }}/deploys/${{ steps.prev-deploy.outputs.id }}/rollback" \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" | jq .
          echo "Rollback initiated."

  deploy-frontend:
    needs: validate
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'production' }}
    outputs:
      deploy-url: ${{ steps.deploy.outputs.url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install Vercel CLI
        run: npm i -g vercel@latest

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=${{ github.event.inputs.environment || 'production' }} --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: apps/web

      - name: Build
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: apps/web

      - name: Deploy to Vercel
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }} 2>&1 | tail -1)
          echo "url=$url" >> $GITHUB_OUTPUT
          echo "Deployed to: $url"
        working-directory: apps/web

      - name: Verify frontend
        run: |
          sleep 10
          status=$(curl -s -o /dev/null -w "%{http_code}" "${{ steps.deploy.outputs.url }}")
          if [ "$status" != "200" ]; then
            echo "ERROR: Frontend returned HTTP $status"
            exit 1
          fi
          echo "Frontend is live!"

  smoke-test:
    needs: [deploy-backend, deploy-frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run smoke tests
        env:
          FRONTEND_URL: ${{ needs.deploy-frontend.outputs.deploy-url }}
        run: |
          echo "Running post-deployment smoke tests..."

          # Determine backend URL
          if [ "${{ github.event.inputs.environment }}" = "staging" ]; then
            BACKEND_URL="${{ secrets.RENDER_BACKEND_URL_STAGING }}"
          else
            BACKEND_URL="${{ secrets.RENDER_BACKEND_URL }}"
          fi

          # Backend health
          health=$(curl -sf "${BACKEND_URL}/health" | jq -r '.status')
          if [ "$health" != "healthy" ]; then
            echo "ERROR: Backend status=$health"
            exit 1
          fi
          echo "  ✓ Backend healthy"

          # Backend API key auth
          status=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "X-API-Key: ${{ secrets.API_ACCESS_KEY }}" \
            "${BACKEND_URL}/api/v1/properties?limit=1")
          if [ "$status" != "200" ]; then
            echo "ERROR: API returned $status (expected 200)"
            exit 1
          fi
          echo "  ✓ API auth working"

          # Frontend — use deployed URL from deploy-frontend output
          status=$(curl -s -o /dev/null -w "%{http_code}" "${FRONTEND_URL}")
          if [ "$status" != "200" ]; then
            echo "ERROR: Frontend returned $status (expected 200)"
            exit 1
          fi
          echo "  ✓ Frontend live"

          echo "All smoke tests passed!"
