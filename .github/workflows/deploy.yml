name: Deploy Pipeline

on:
  push:
    branches: [main, dev]
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: false
        default: ""
        type: choice
        options:
          - ""
          - production
          - staging

permissions:
  contents: read
  deployments: write

env:
  RENDER_SERVICE_ID_API: ${{ secrets.RENDER_SERVICE_ID_API }}
  RENDER_SERVICE_ID_WEB: ${{ secrets.RENDER_SERVICE_ID_WEB }}
  RENDER_BACKEND_URL: ${{ secrets.RENDER_BACKEND_URL }}

jobs:
  ci-check:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev'
    steps:
      - uses: actions/checkout@v6

      - name: Verify CI passed on target branch
        uses: actions/github-script@v9
        with:
          script: |
            const branch = context.ref.replace('refs/heads/', '');
            const runs = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'ci.yml',
              branch: branch,
              status: 'completed',
              per_page: 1
            });
            if (!runs.data.workflow_runs.length || runs.data.workflow_runs[0].conclusion !== 'success') {
              core.setFailed(`Last CI run on ${branch} did not succeed. Deploy blocked.`);
            } else {
              core.info(`CI passed on ${branch}. Proceeding with deployment.`);
            }

  validate:
    needs: [ci-check]
    if: always() && needs.ci-check.result != 'failure'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate deployment configs
        run: |
          echo "Validating deployment configurations..."
          # Check required files exist (Dockerfiles always needed)
          for f in deploy/docker/Dockerfile.backend deploy/docker/Dockerfile.frontend deploy/compose/docker-compose.yml; do
            if [ ! -f "$f" ]; then
              echo "ERROR: Missing $f"
              exit 1
            fi
            echo "  ✓ $f"
          done

          # Check render.yaml and vercel.json only on main/dev
          if [ "${{ github.ref }}" = "refs/heads/main" ] || [ "${{ github.ref }}" = "refs/heads/dev" ]; then
            for f in render.yaml vercel.json; do
              if [ ! -f "$f" ]; then
                echo "WARNING: Missing $f (needed for Render/Vercel deploy)"
              fi
            done
            if [ -f render.yaml ] && grep -q "REPLACE_WITH" render.yaml; then
              echo "ERROR: render.yaml contains placeholder values"
              exit 1
            fi
            echo "  ✓ Deploy configs validated"
          fi

          # Check Dockerfiles parse correctly (dry-run without full build)
          docker build --check -f deploy/docker/Dockerfile.backend . 2>/dev/null || \
            docker build -f deploy/docker/Dockerfile.backend . --check 2>/dev/null || \
            echo "  ⚠ Docker build check skipped (Docker daemon may not support --check)"
          echo "  ✓ Backend Dockerfile syntax OK"

  deploy-backend:
    needs: validate
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || (github.ref == 'refs/heads/dev' && 'staging') || 'production' }}
    steps:
      - name: Select Render service
        id: service
        run: |
          DEPLOY_ENV="${{ github.event.inputs.environment || (github.ref == 'refs/heads/dev' && 'staging') || 'production' }}"
          echo "Deploy environment: $DEPLOY_ENV"
          if [ "$DEPLOY_ENV" = "staging" ]; then
            echo "id=${{ secrets.RENDER_SERVICE_ID_API_STAGING }}" >> $GITHUB_OUTPUT
            echo "url=${{ secrets.RENDER_BACKEND_URL_STAGING }}" >> $GITHUB_OUTPUT
          else
            echo "id=${{ secrets.RENDER_SERVICE_ID_API }}" >> $GITHUB_OUTPUT
            echo "url=${{ secrets.RENDER_BACKEND_URL }}" >> $GITHUB_OUTPUT
          fi

      - name: Get previous deploy ID (for rollback)
        id: prev-deploy
        run: |
          PREV=$(curl -s "https://api.render.com/v1/services/${{ steps.service.outputs.id }}/deploys?limit=1" \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" | jq -r '.[0].id // empty')
          echo "id=$PREV" >> $GITHUB_OUTPUT

      - name: Trigger Render backend deploy
        if: steps.service.outputs.id != ''
        run: |
          curl -s -X POST "https://api.render.com/v1/services/${{ steps.service.outputs.id }}/deploys" \
            -H "Accept: application/json" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            -d '{"clearCache": "clear"}' | jq .

      - name: Wait for backend health
        run: |
          echo "Waiting for backend to become healthy..."
          for i in $(seq 1 30); do
            if curl -sf "${{ steps.service.outputs.url }}/health" | jq -e '.status == "healthy"' >/dev/null 2>&1; then
              echo "Backend is healthy!"
              exit 0
            fi
            echo "  Attempt $i/30 - waiting 30s..."
            sleep 30
          done
          echo "ERROR: Backend health check failed after 15 minutes"
          exit 1

      - name: Rollback on failure
        if: failure() && steps.prev-deploy.outputs.id != ''
        run: |
          echo "Rolling back to previous deploy: ${{ steps.prev-deploy.outputs.id }}"
          curl -s -X POST "https://api.render.com/v1/services/${{ steps.service.outputs.id }}/deploys/${{ steps.prev-deploy.outputs.id }}/rollback" \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" | jq .
          echo "Rollback initiated."

  deploy-frontend:
    needs: validate
    runs-on: ubuntu-latest
    continue-on-error: true
    environment: ${{ github.event.inputs.environment || (github.ref == 'refs/heads/dev' && 'staging') || 'production' }}
    outputs:
      deploy-url: ${{ steps.deploy.outputs.url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install Vercel CLI
        run: npm i -g vercel@latest

      - name: Pull Vercel environment
        run: |
          DEPLOY_ENV="${{ github.event.inputs.environment || (github.ref == 'refs/heads/dev' && 'staging') || 'production' }}"
          VERCEL_ENV="${DEPLOY_ENV}"
          if [ "$VERCEL_ENV" = "staging" ]; then VERCEL_ENV="preview"; fi
          vercel pull --yes --environment=${VERCEL_ENV} --token=${{ secrets.VERCEL_TOKEN }} --cwd apps/web

      - name: Build
        run: |
          DEPLOY_ENV="${{ github.event.inputs.environment || (github.ref == 'refs/heads/dev' && 'staging') || 'production' }}"
          if [ "$DEPLOY_ENV" = "production" ]; then
            vercel build --prod --token=${{ secrets.VERCEL_TOKEN }} --cwd apps/web
          else
            vercel build --token=${{ secrets.VERCEL_TOKEN }} --cwd apps/web
          fi

      - name: Deploy to Vercel
        id: deploy
        run: |
          DEPLOY_ENV="${{ github.event.inputs.environment || (github.ref == 'refs/heads/dev' && 'staging') || 'production' }}"
          if [ "$DEPLOY_ENV" = "production" ]; then
            vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }} --cwd apps/web > /tmp/vercel-output.txt 2>&1
          else
            vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }} --cwd apps/web > /tmp/vercel-output.txt 2>&1
          fi
          echo "=== Vercel deploy output ==="
          cat /tmp/vercel-output.txt
          url=$(grep -oE 'https://[a-zA-Z0-9.-]+\.vercel\.app' /tmp/vercel-output.txt | tail -1)
          if [ -z "$url" ]; then
            url=$(grep -oE 'https://[a-zA-Z0-9.-]+\.[a-z]+' /tmp/vercel-output.txt | tail -1)
          fi
          echo "url=$url" >> $GITHUB_OUTPUT
          echo "Deployed to: $url"

      - name: Verify frontend
        run: |
          sleep 10
          URL="${{ steps.deploy.outputs.url }}"
          if [ -z "$URL" ]; then
            echo "ERROR: No deploy URL captured"
            exit 1
          fi
          status=$(curl -sL -o /dev/null -w "%{http_code}" "$URL")
          if [ "$status" -ge 200 ] && [ "$status" -lt 400 ]; then
            echo "Frontend is live at $URL (HTTP $status)"
          else
            echo "ERROR: Frontend returned HTTP $status"
            exit 1
          fi

  smoke-test:
    needs: [deploy-backend, deploy-frontend]
    if: always() && needs.deploy-backend.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run smoke tests
        env:
          FRONTEND_URL: ${{ needs.deploy-frontend.outputs.deploy-url }}
        run: |
          echo "Running post-deployment smoke tests..."

          # Determine backend URL
          DEPLOY_ENV="${{ github.event.inputs.environment || (github.ref == 'refs/heads/dev' && 'staging') || 'production' }}"
          if [ "$DEPLOY_ENV" = "staging" ]; then
            BACKEND_URL="${{ secrets.RENDER_BACKEND_URL_STAGING }}"
          else
            BACKEND_URL="${{ secrets.RENDER_BACKEND_URL }}"
          fi

          # Backend health
          health=$(curl -sf "${BACKEND_URL}/health" | jq -r '.status')
          if [ "$health" != "healthy" ]; then
            echo "ERROR: Backend status=$health"
            exit 1
          fi
          echo "  ✓ Backend healthy"

          # Backend API key auth
          status=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "X-API-Key: ${{ secrets.API_ACCESS_KEY }}" \
            "${BACKEND_URL}/api/v1/properties?limit=1")
          if [ "$status" != "200" ]; then
            echo "ERROR: API returned $status (expected 200)"
            exit 1
          fi
          echo "  ✓ API auth working"

          # Frontend — use deployed URL from deploy-frontend output
          status=$(curl -s -o /dev/null -w "%{http_code}" "${FRONTEND_URL}")
          if [ "$status" != "200" ]; then
            echo "ERROR: Frontend returned $status (expected 200)"
            exit 1
          fi
          echo "  ✓ Frontend live"

          echo "All smoke tests passed!"
