name: CI/CD

permissions:
  contents: read
  pull-requests: read

on:
  push:
    branches: [main, dev, ver4]
  pull_request:
    branches: [main, dev, ver4]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ===== STAGE 1: Quick Checks (Parallel) =====

  quick-checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check:
          - name: gitleaks
            command: echo "Gitleaks scan"
          - name: secret-validation
            command: |
              echo "Checking for placeholder secrets..."
              PATTERNS=("your-generated-api-key-here" "your-jwt-secret-key-here" "change-me" "changeme")
              EXIT_CODE=0
              for pattern in "${PATTERNS[@]}"; do
                if grep -r "$pattern" deploy/ 2>/dev/null; then
                  echo "::error::Found placeholder '$pattern' in deploy config"
                  EXIT_CODE=1
                fi
              done
              exit $EXIT_CODE
          - name: backend-lint
            command: |
              cd apps/api
              python -m ruff check .
          - name: backend-typecheck
            command: |
              cd apps/api
              python -m mypy . --explicit-package-bases

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up uv
        if: matrix.check.name != 'gitleaks' && matrix.check.name != 'secret-validation'
        uses: astral-sh/setup-uv@v1
        with:
          version: 'latest'

      - name: Set up Python
        if: matrix.check.name != 'gitleaks' && matrix.check.name != 'secret-validation'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        if: matrix.check.name == 'backend-lint' || matrix.check.name == 'backend-typecheck'
        run: |
          cd apps/api
          uv pip install --system -r requirements.txt
          uv pip install --system pytest ruff mypy

      - name: Run ${{ matrix.check.name }}
        run: ${{ matrix.check.command }}
        continue-on-error: ${{ matrix.check.name == 'backend-typecheck' }}

  # ===== STAGE 2: Backend Tests (Parallel by Test Type) =====

  backend-tests:
    runs-on: ubuntu-latest
    needs: [quick-checks]
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        test-suite:
          - name: unit-agents
            path: tests/unit/agents
            coverage-min: 90
          - name: unit-analytics
            path: tests/unit/analytics
            coverage-min: 90
          - name: unit-api
            path: tests/unit/api
            coverage-min: 90
          - name: unit-core
            path: tests/unit/core
            coverage-min: 85
          - name: unit-models
            path: tests/unit/models
            coverage-min: 90
          - name: unit-services
            path: tests/unit/services
            coverage-min: 85
          - name: unit-tools
            path: tests/unit/tools
            coverage-min: 90
          - name: unit-utils
            path: tests/unit/utils
            coverage-min: 85
          - name: integration
            path: tests/integration
            coverage-min: 70

    defaults:
      run:
        working-directory: apps/api

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@v1
        with:
          version: 'latest'

      - name: Cache uv
        uses: actions/cache@v5
        with:
          path: ~/.local/share/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('apps/api/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          uv pip install --system -r requirements.txt
          uv pip install --system pytest pytest-asyncio pytest-cov pytest-xdist pytest-timeout ruff httpx types-requests

      - name: Run ${{ matrix.test-suite.name }} tests
        run: |
          python -m pytest ${{ matrix.test-suite.path }} \
            --cov=. \
            --cov-report=xml \
            --cov-report=term \
            -n auto \
            --timeout=600 \
            --maxfail=5 \
            -v

      - name: Upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.test-suite.name }}
          path: apps/api/coverage.xml

  # ===== STAGE 3: Backend Validation Tests (Sequential) =====

  backend-validation:
    runs-on: ubuntu-latest
    needs: [quick-checks]
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/api

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@v1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          uv pip install --system -r requirements.txt
          uv pip install --system pytest

      - name: RuleEngine test
        run: |
          python -m pytest -q tests/integration/test_rule_engine_clean.py

      - name: Forbidden tokens scan
        run: |
          python scripts/security/forbidden_tokens.py

      - name: OpenAPI breaking-change detection
        run: |
          python scripts/openapi_diff.py --baseline ../../docs/api-v1-baseline.json

      - name: Alembic migration check
        run: |
          python -m alembic check

  # ===== STAGE 4: Frontend Tests =====

  frontend-tests:
    runs-on: ubuntu-latest
    needs: [quick-checks]
    defaults:
      run:
        working-directory: apps/web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache npm
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('apps/web/package-lock.json') }}

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm run test:ci

      - name: Upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage
          path: apps/web/coverage

  # ===== STAGE 5: Security Scans (Parallel) =====

  security:
    runs-on: ubuntu-latest
    needs: [backend-tests]
    strategy:
      fail-fast: false
      matrix:
        scan:
          - name: bandit
            command: |
              cd apps/api
              mkdir -p ../../artifacts
              python -m bandit -r . -x tests,node_modules,.venv,.venv312 --severity-level high -f json -o ../../artifacts/bandit.json
          - name: semgrep
            command: semgrep scan --config semgrep.yml --error
          - name: pip-audit
            command: |
              cd apps/api
              mkdir -p ../../artifacts
              python -m pip_audit -r requirements.txt -f json -o ../../artifacts/pip-audit.json

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install security tools
        run: |
          python -m pip install --upgrade pip
          if [ "${{ matrix.scan.name }}" = "bandit" ]; then
            python -m pip install bandit
          elif [ "${{ matrix.scan.name }}" = "semgrep" ]; then
            python -m pip install semgrep
          elif [ "${{ matrix.scan.name }}" = "pip-audit" ]; then
            python -m pip install pip-audit
          fi

      - name: Run ${{ matrix.scan.name }}
        run: ${{ matrix.scan.command }}
        continue-on-error: true

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: security-${{ matrix.scan.name }}
          path: artifacts/

  # ===== STAGE 6: Summary =====

  ci-summary:
    runs-on: ubuntu-latest
    if: always()
    needs: [quick-checks, backend-tests, backend-validation, frontend-tests, security]

    steps:
      - name: Check results
        run: |
          echo "Quick checks: ${{ needs.quick-checks.result }}"
          echo "Backend tests: ${{ needs.backend-tests.result }}"
          echo "Backend validation: ${{ needs.backend-validation.result }}"
          echo "Frontend tests: ${{ needs.frontend-tests.result }}"
          echo "Security: ${{ needs.security.result }}"

          if [ "${{ needs.quick-checks.result }}" != "success" ] || \
             [ "${{ needs.backend-tests.result }}" != "success" ] || \
             [ "${{ needs.backend-validation.result }}" != "success" ] || \
             [ "${{ needs.frontend-tests.result }}" != "success" ]; then
            echo "::error::One or more critical jobs failed"
            exit 1
          fi
