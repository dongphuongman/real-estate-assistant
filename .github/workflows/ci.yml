name: CI/CD AI Real Estate Assistant (Full)

permissions:
  contents: read
  pull-requests: read
  security-events: write
  actions: read

on:
  push:
    branches: [main, dev, ver4]
  pull_request:
    branches: [main, dev, ver4]
  workflow_dispatch:
    inputs:
      enable_deep_analysis:
        description: 'Enable Stage 5 deep analysis (CodeQL, Trivy, Lighthouse, E2E)'
        required: false
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ===== STAGE 1: Quick Checks (Parallel) =====

  quick-checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check:
          - name: gitleaks
            command: echo "Gitleaks scan"
          - name: secret-validation
            command: |
              echo "Checking for placeholder secrets..."
              PATTERNS=("your-generated-api-key-here" "your-jwt-secret-key-here" "change-me" "changeme")
              EXIT_CODE=0
              for pattern in "${PATTERNS[@]}"; do
                if grep -r "$pattern" deploy/ 2>/dev/null; then
                  echo "::error::Found placeholder '$pattern' in deploy config"
                  EXIT_CODE=1
                fi
              done
              exit $EXIT_CODE
          - name: backend-lint
            command: |
              cd apps/api
              python -m ruff check .
          - name: backend-typecheck
            command: |
              cd apps/api
              python -m mypy . --explicit-package-bases

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up uv
        if: matrix.check.name != 'gitleaks' && matrix.check.name != 'secret-validation'
        uses: astral-sh/setup-uv@v1
        with:
          version: 'latest'

      - name: Set up Python
        if: matrix.check.name != 'gitleaks' && matrix.check.name != 'secret-validation'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        if: matrix.check.name == 'backend-lint' || matrix.check.name == 'backend-typecheck'
        run: |
          cd apps/api
          uv pip install --system -r requirements.txt
          uv pip install --system pytest ruff mypy

      - name: Run ${{ matrix.check.name }}
        run: ${{ matrix.check.command }}
        continue-on-error: ${{ matrix.check.name == 'backend-typecheck' }}

  # ===== STAGE 2: Backend Tests (Parallel by Test Type) =====

  backend-tests:
    runs-on: ubuntu-latest
    needs: [quick-checks]
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        test-suite:
          - name: unit-agents
            path: tests/unit/agents
            coverage-min: 90
          - name: unit-analytics
            path: tests/unit/analytics
            coverage-min: 90
          - name: unit-api
            path: tests/unit/api
            coverage-min: 90
          - name: unit-core
            path: tests/unit/core
            coverage-min: 85
          - name: unit-models
            path: tests/unit/models
            coverage-min: 90
          - name: unit-services
            path: tests/unit/services
            coverage-min: 85
          - name: unit-tools
            path: tests/unit/tools
            coverage-min: 90
          - name: unit-utils
            path: tests/unit/utils
            coverage-min: 85
          - name: integration
            path: tests/integration
            coverage-min: 70

    defaults:
      run:
        working-directory: apps/api

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@v1
        with:
          version: 'latest'

      - name: Cache uv
        uses: actions/cache@v5
        with:
          path: ~/.local/share/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('apps/api/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          uv pip install --system -r requirements.txt
          uv pip install --system pytest pytest-asyncio pytest-cov pytest-xdist pytest-timeout ruff httpx types-requests

      - name: Run ${{ matrix.test-suite.name }} tests
        run: |
          python -m pytest ${{ matrix.test-suite.path }} \
            --cov=. \
            --cov-report=xml \
            --cov-report=term \
            -n auto \
            --timeout=600 \
            --maxfail=5 \
            -v

      - name: Coverage summary
        run: |
          python - <<'PY'
          import os
          import xml.etree.ElementTree as ET
          tree = ET.parse("coverage.xml")
          root = tree.getroot()
          rate = float(root.attrib.get("line-rate", 0)) * 100
          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          with open(summary, "a", encoding="utf-8") as fh:
              fh.write(f"### Coverage: ${{ matrix.test-suite.name }}\n\n")
              fh.write(f"Line coverage: {rate:.2f}%\n")
          PY

      - name: Fetch base ref (PR only)
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          git fetch origin ${{ github.base_ref }} --depth=1

      - name: 'Coverage gate (diff)'
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          python ../../scripts/ci/coverage_gate.py diff --coverage-xml coverage.xml --min-coverage ${{ matrix.test-suite.coverage-min }} --base-ref origin/${{ github.base_ref }} --exclude 'tests/*' --exclude 'scripts/*' --exclude 'workflows/*'

      - name: 'Coverage gate (critical files)'
        if: matrix.test-suite.name == 'unit-api'
        run: |
          python ../../scripts/ci/coverage_gate.py critical --coverage-xml coverage.xml --min-coverage 90 --include 'api/*.py' --include 'api/routers/*.py' --include 'rules/*.py' --include 'models/provider_factory.py' --include 'models/user_model_preferences.py' --include 'config/*.py'

      - name: Upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.test-suite.name }}
          path: apps/api/coverage.xml

  # ===== STAGE 3: Backend Validation Tests (Sequential) =====

  backend-validation:
    runs-on: ubuntu-latest
    needs: [quick-checks]
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/api

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@v1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          uv pip install --system -r requirements.txt
          uv pip install --system pytest

      - name: RuleEngine test
        run: |
          python -m pytest -q tests/integration/test_rule_engine_clean.py

      - name: Forbidden tokens scan
        run: |
          python ../../scripts/security/forbidden_tokens.py

      - name: OpenAPI breaking-change detection
        run: |
          python ../../scripts/api/openapi_diff.py --baseline ../../docs/api-v1-baseline.json

      - name: OpenAPI schema drift check
        continue-on-error: true
        run: |
          python ../../scripts/docs/export_openapi.py --check

      - name: API reference drift check
        continue-on-error: true
        run: |
          python ../../scripts/docs/generate_api_reference.py --check

      - name: Alembic migration check
        run: |
          python -m alembic check

  # ===== STAGE 4: Frontend Tests =====

  frontend-tests:
    runs-on: ubuntu-latest
    needs: [quick-checks]
    defaults:
      run:
        working-directory: apps/web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache npm
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('apps/web/package-lock.json') }}

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: npm audit (block on high/critical)
        run: npm audit --audit-level=high --omit=dev
        continue-on-error: true

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm run test:ci

      - name: Frontend coverage summary
        run: |
          node -e 'const fs=require("fs"); const summary=JSON.parse(fs.readFileSync("coverage/coverage-summary.json","utf8")); const total=summary.total; const text=["### Frontend Coverage","","Lines: "+total.lines.pct+"%","Statements: "+total.statements.pct+"%","Functions: "+total.functions.pct+"%","Branches: "+total.branches.pct+"%",""].join("\n"); fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, text);'

      - name: Upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage
          path: apps/web/coverage

  # ===== STAGE 5: Documentation Generation =====

  docs-generation:
    runs-on: ubuntu-latest
    needs: [backend-tests]
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/api

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@v1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          uv pip install --system -r requirements.txt

      - name: Generate OpenAPI documentation
        run: |
          mkdir -p ../../docs/api
          python ../../scripts/docs/export_openapi.py --output ../../docs/api/openapi.json
          python ../../scripts/docs/generate_api_reference.py --schema ../../docs/api/openapi.json --output ../../docs/api/API_REFERENCE.generated.md

      - name: Upload OpenAPI documentation
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: openapi-docs
          path: docs/api/

      - name: Docs summary
        if: always()
        run: |
          echo "### OpenAPI Documentation" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Generated files:" >> $GITHUB_STEP_SUMMARY
          echo "- OpenAPI JSON: docs/api/openapi.json" >> $GITHUB_STEP_SUMMARY
          echo "- API Markdown: docs/api/API_REFERENCE.generated.md" >> $GITHUB_STEP_SUMMARY
          if [ -f ../../docs/api/openapi.json ]; then
            echo "- OpenAPI schema size: $(wc -c < ../../docs/api/openapi.json) bytes" >> $GITHUB_STEP_SUMMARY
          fi

  # ===== STAGE 6: Security Scans (Parallel) =====

  security:
    runs-on: ubuntu-latest
    needs: [backend-tests]
    strategy:
      fail-fast: false
      matrix:
        scan:
          - name: bandit
            command: |
              cd apps/api
              mkdir -p ../../artifacts
              python -m bandit -r . -x tests,node_modules,.venv,.venv312 --severity-level high -f json -o ../../artifacts/bandit.json
          - name: semgrep
            command: semgrep scan --config semgrep.yml --error
          - name: pip-audit
            command: |
              cd apps/api
              mkdir -p ../../artifacts
              python -m pip_audit -r requirements.txt -f json -o ../../artifacts/pip-audit.json

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install security tools
        run: |
          python -m pip install --upgrade pip
          if [ "${{ matrix.scan.name }}" = "bandit" ]; then
            python -m pip install bandit
          elif [ "${{ matrix.scan.name }}" = "semgrep" ]; then
            python -m pip install semgrep
          elif [ "${{ matrix.scan.name }}" = "pip-audit" ]; then
            python -m pip install pip-audit
          fi

      - name: Run ${{ matrix.scan.name }}
        run: ${{ matrix.scan.command }}
        continue-on-error: true

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: security-${{ matrix.scan.name }}
          path: artifacts/

  # ===== STAGE 7: Integration Tests =====

  compose-smoke:
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Docker Compose smoke test
        continue-on-error: true
        env:
          API_ACCESS_KEY: ci-test-key
        run: |
          docker --version
          docker compose version
          set -e
          for attempt in 1 2; do
            python scripts/docker/compose_smoke.py --ci --timeout-seconds 600 && break
            if [ $attempt -eq 2 ]; then exit 1; fi
            echo "Compose smoke failed. Retrying..."
          done

  # ===== STAGE 8: Deep Analysis (main/ver4 or manual) =====

  codeql-python:
    runs-on: ubuntu-latest
    if: |
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/ver4') ||
      (github.event_name == 'workflow_dispatch' && inputs.enable_deep_analysis == 'true')
    needs: [security]
    timeout-minutes: 30
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python
          build-mode: none
          queries: security-extended,security-and-quality
          config: |
            paths-ignore:
              - '**/node_modules'
              - '**/.next'
              - '**/dist'
              - '**/build'
              - '**/coverage'
              - '**/__pycache__'
              - '**/venv'
              - '**/.venv'
              - '**/.venv312'
              - '**/*.test.js'
              - '**/*.test.ts'
              - '**/*.test.tsx'
              - '**/tests/**'

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: '/language:python'
          upload: true
        continue-on-error: true

  codeql-javascript:
    runs-on: ubuntu-latest
    if: |
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/ver4') ||
      (github.event_name == 'workflow_dispatch' && inputs.enable_deep_analysis == 'true')
    needs: [security]
    timeout-minutes: 30
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended,security-and-quality
          config: |
            paths-ignore:
              - '**/node_modules'
              - '**/.next'
              - '**/dist'
              - '**/build'
              - '**/coverage'
              - '**/__pycache__'
              - '**/venv'
              - '**/.venv'
              - '**/.venv312'
              - '**/*.test.js'
              - '**/*.test.ts'
              - '**/*.test.tsx'
              - '**/tests/**'

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: '/language:javascript-typescript'
          upload: true
        continue-on-error: true

  container-scan:
    runs-on: ubuntu-latest
    if: |
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/ver4') ||
      (github.event_name == 'workflow_dispatch' && inputs.enable_deep_analysis == 'true')
    needs: [frontend-tests]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build backend image
        run: |
          docker build -f deploy/docker/Dockerfile.backend -t ai-backend:ci .

      - name: Build frontend image
        run: |
          docker build -f deploy/docker/Dockerfile.frontend -t ai-frontend:ci .

      - name: Trivy scan (backend)
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: ai-backend:ci
          format: table
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Trivy scan (frontend)
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: ai-frontend:ci
          format: table
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

  lighthouse:
    runs-on: ubuntu-latest
    if: |
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/ver4') ||
      (github.event_name == 'workflow_dispatch' && inputs.enable_deep_analysis == 'true')
    needs: [frontend-tests]
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache npm
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('apps/web/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js
        run: npm run build
        env:
          LHCI_AUTH_BYPASS: 'true'
          NEXT_PUBLIC_API_URL: /api/v1

      - name: Run Lighthouse CI
        run: npx lhci autorun
        env:
          LHCI_AUTH_BYPASS: 'true'

      - name: Upload Lighthouse results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-results
          path: apps/web/.lighthouseci

  e2e:
    runs-on: ubuntu-latest
    if: |
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/ver4') ||
      (github.event_name == 'workflow_dispatch' && inputs.enable_deep_analysis == 'true')
    needs: [frontend-tests]
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache npm
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Install root dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        env:
          CI: 'true'
          PLAYWRIGHT_START_WEB: 'false'
        run: npx playwright test

      - name: Upload E2E report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-report
          path: artifacts/e2e-report/

      - name: Upload E2E output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-output
          path: artifacts/e2e-output/

  # ===== STAGE 9: Pipeline Health Summary =====

  pipeline-health:
    runs-on: ubuntu-latest
    if: always()
    needs: [quick-checks, backend-tests, backend-validation, frontend-tests, 
            docs-generation, security, compose-smoke, codeql-python, 
            codeql-javascript, container-scan, lighthouse, e2e]
    permissions:
      contents: read
    steps:
      - name: Summarize pipeline health
        uses: actions/github-script@v8
        with:
          script: |
            const needs = ${{ toJson(needs) }};
            const rows = Object.entries(needs).map(([job, data]) => [job, (data && data.result) || 'unknown']);
            core.summary.addHeading('Pipeline Health');
            core.summary.addTable([['Job', 'Result'], ...rows]);
            const nonSuccess = rows.filter(([, result]) => result !== 'success' && result !== 'skipped');
            const nonSuccessList = nonSuccess.map(([job, result]) => job + '(' + result + ')').join(', ');

            if (nonSuccess.length) {
              core.summary.addRaw('Non-success jobs: ' + nonSuccessList);
            } else {
              core.summary.addRaw('All pipeline jobs succeeded.');
            }
            
            // Only fail on critical jobs
            const criticalJobs = ['quick-checks', 'backend-tests', 'backend-validation', 'frontend-tests'];
            const criticalFailures = rows.filter(([job, result]) => 
              criticalJobs.includes(job) && result !== 'success'
            );
            
            if (criticalFailures.length) {
              core.setFailed('Critical jobs failed: ' + criticalFailures.map(([job]) => job).join(', '));
            }

            await core.summary.write();
