# Simplified CI Workflow - Based on Deep Research
# This workflow runs tests sequentially with proper timeouts and error handling
# Created: 2026-05-10
# Research: See CI_LOCAL_TEST_ANALYSIS.md for details

name: CI Simplified

permissions:
  contents: read
  pull-requests: read

on:
  push:
    branches: [main, dev, ver4]
  pull_request:
    branches: [main, dev, ver4]
  workflow_dispatch:

concurrency:
  group: ci-simplified-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ===== STAGE 1: Quick Checks =====

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  secret-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for placeholder secrets
        run: |
          echo "Checking for placeholder secrets..."
          PATTERNS=("your-generated-api-key-here" "your-jwt-secret-key-here" "change-me" "changeme")
          EXIT_CODE=0
          for pattern in "${PATTERNS[@]}"; do
            if grep -r "$pattern" deploy/ 2>/dev/null; then
              echo "::error::Found placeholder '$pattern'"
              EXIT_CODE=1
            fi
          done
          exit $EXIT_CODE

  # ===== STAGE 2: Backend Lint & Type Check =====

  backend-lint:
    runs-on: ubuntu-latest
    needs: [gitleaks, secret-validation]
    defaults:
      run:
        working-directory: apps/api
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'  # Exact version for consistency

      - name: Cache pip
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('apps/api/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff mypy

      - name: Lint with ruff
        run: python -m ruff check .

      - name: Type check with mypy
        run: python -m mypy . --explicit-package-bases
        continue-on-error: true  # Non-blocking

  # ===== STAGE 3: Backend Tests (Sequential) =====

  backend-tests:
    runs-on: ubuntu-latest
    needs: [backend-lint]
    defaults:
      run:
        working-directory: apps/api
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'

      - name: Cache pip
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('apps/api/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-timeout pytest-cov

      - name: Run unit tests
        run: |
          python -m pytest tests/unit \
            --ignore=tests/unit/test_dev_start_script.py \
            --ignore=tests/unit/scripts/test_start_docker_mode.py \
            -v --tb=short --timeout=60 \
            --cov=. --cov-report=xml --cov-report=term
        env:
          ENVIRONMENT: test
          API_ACCESS_KEY: ci-test-key
          ENABLE_JWT_AUTH: "true"

      - name: Run integration tests
        run: |
          python -m pytest tests/integration \
            -v --tb=short --timeout=120
        env:
          ENVIRONMENT: test
          API_ACCESS_KEY: ci-test-key

      - name: Upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: apps/api/coverage.xml

  # ===== STAGE 4: Backend Validation (Non-blocking) =====

  backend-validation:
    runs-on: ubuntu-latest
    needs: [backend-lint]
    defaults:
      run:
        working-directory: apps/api
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: RuleEngine test
        run: python -m pytest -q tests/integration/test_rule_engine_clean.py
        continue-on-error: true

      - name: Forbidden tokens scan
        working-directory: .
        run: python scripts/security/forbidden_tokens.py
        continue-on-error: true

      - name: OpenAPI breaking-change detection
        working-directory: .
        run: python scripts/api/openapi_diff.py --baseline docs/api-v1-baseline.json
        continue-on-error: true

      - name: Alembic migration check (with timeout)
        working-directory: apps/api
        run: |
          timeout 30s python -m alembic check || echo "Alembic check skipped (timeout or error)"
        continue-on-error: true

  # ===== STAGE 5: Frontend Build & Lint =====

  frontend-build:
    runs-on: ubuntu-latest
    needs: [gitleaks, secret-validation]
    defaults:
      run:
        working-directory: apps/web
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Cache npm
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('apps/web/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: /api/v1

  # ===== STAGE 6: Frontend Tests =====

  frontend-tests:
    runs-on: ubuntu-latest
    needs: [frontend-build]
    defaults:
      run:
        working-directory: apps/web
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Cache npm
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('apps/web/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test:ci

      - name: Upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage
          path: apps/web/coverage

  # ===== STAGE 7: Security Scans =====

  security-sast:
    runs-on: ubuntu-latest
    needs: [backend-lint]
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'

      - name: Install security tools
        run: |
          python -m pip install --upgrade pip
          pip install bandit semgrep

      - name: Run Bandit
        run: |
          mkdir -p artifacts
          python -m bandit -r apps/api \
            -x tests,node_modules,.history,venv,.venv \
            --severity-level high --confidence-level high \
            -f json -o artifacts/bandit.json
        continue-on-error: true

      - name: Run Semgrep
        run: semgrep scan --config semgrep.yml --error
        continue-on-error: true

      - name: Upload bandit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bandit-report
          path: artifacts/bandit.json

  # ===== STAGE 8: Pipeline Health Summary =====

  pipeline-health:
    runs-on: ubuntu-latest
    if: always()
    needs: [
      gitleaks,
      secret-validation,
      backend-lint,
      backend-tests,
      backend-validation,
      frontend-build,
      frontend-tests,
      security-sast
    ]
    steps:
      - name: Summarize pipeline health
        uses: actions/github-script@v8
        with:
          script: |
            const needs = ${{ toJson(needs) }};
            const rows = Object.entries(needs).map(([job, data]) => [job, (data && data.result) || 'unknown']);
            core.summary.addHeading('Pipeline Health');
            core.summary.addTable([['Job', 'Result'], ...rows]);

            const failed = rows.filter(([, result]) => result === 'failure');
            const nonSuccess = rows.filter(([, result]) => result !== 'success' && result !== 'skipped');

            if (failed.length > 0) {
              core.summary.addRaw(`\n❌ **Failed jobs (${failed.length}):** ${failed.map(([job]) => job).join(', ')}`);
            }

            if (nonSuccess.length > 0 && failed.length === 0) {
              core.summary.addRaw(`\n⚠️ **Non-success jobs (${nonSuccess.length}):** ${nonSuccess.map(([job, result]) => `${job}(${result})`).join(', ')}`);
            }

            if (failed.length === 0 && nonSuccess.length === 0) {
              core.summary.addRaw('\n✅ **All pipeline jobs succeeded!**');
            }

            await core.summary.write();

            // Fail the workflow if critical jobs failed
            const criticalJobs = ['backend-tests', 'frontend-tests'];
            const criticalFailed = failed.filter(([job]) => criticalJobs.includes(job));

            if (criticalFailed.length > 0) {
              core.setFailed(`Critical jobs failed: ${criticalFailed.map(([job]) => job).join(', ')}`);
            }
