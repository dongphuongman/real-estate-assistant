name: Semgrep

on:
  push:
    branches: [ "main", "ver4" ]
  pull_request:
    branches: [ "main", "ver4" ]
  schedule:
    - cron: '30 0 * * 0'

jobs:
  semgrep:
    name: Scan
    runs-on: ubuntu-latest
    container:
      image: returntocorp/semgrep
    if: (github.actor != 'dependabot[bot]')
    steps:
      - uses: actions/checkout@v4
      - run: semgrep ci
        env:
           SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
